name: Desktop checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-bundle:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 1
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb xdotool
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: npm run build
      - name: Inspect Debian package
        run: dpkg-deb --info src-tauri/target/release/bundle/deb/*.deb
      - name: Smoke-test installed desktop app
        run: |
          sudo dpkg -i src-tauri/target/release/bundle/deb/*.deb
          GDK_BACKEND=x11 WEBKIT_DISABLE_COMPOSITING_MODE=1 xvfb-run -a bash .github/scripts/smoke-desktop.sh /usr/bin/awsome
      - uses: actions/upload-artifact@v4
        with:
          name: awsome-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
