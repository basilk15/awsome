name: Desktop checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-bundle:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 1
    steps:
      - uses: actions/checkout@v4
      - name: Install desktop smoke-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm test
      - run: CARGO_TARGET_DIR=src-tauri/target CARGO_BUILD_JOBS=1 cargo test --manifest-path native/Cargo.toml --release --locked
      - run: cargo fmt --manifest-path native/Cargo.toml --all -- --check
      - run: npm run build
      - name: Inspect Debian package
        run: dpkg-deb --info release/*.deb
      - name: Smoke-test installed desktop app
        run: |
          sudo dpkg -i release/*.deb
          xvfb-run -a bash .github/scripts/smoke-desktop.sh /usr/bin/awsome
      - uses: actions/upload-artifact@v4
        with:
          name: awsome-deb
          path: release/*.deb
          if-no-files-found: error
