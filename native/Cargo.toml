[package]
name = "awsome-native"
version = "0.2.0"
edition = "2021"
license = "MIT"

[dependencies]
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-ec2 = "1"
aws-sdk-elasticloadbalancingv2 = "1"
aws-sdk-rds = "1"
futures-util = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
